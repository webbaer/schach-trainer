<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Schach-Trainer</title>
  <meta name="theme-color" content="#160f11">
  <meta name="description" content="Schach lernen offline: Bots, Rätsel und Partieanalyse">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Schach">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <nav class="sidebar">
      <div class="brand"><span class="logo">♞</span><div>Schach-Trainer<small>OFFLINE · KOSTENLOS</small></div></div>
      <div class="tabs">
        <button data-tab="home"><span class="ic">🏠</span>Übersicht</button>
        <button data-tab="play"><span class="ic">♟</span>Spielen</button>
        <button data-tab="puzzle"><span class="ic">🧩</span>Rätsel</button>
        <button data-tab="analysis"><span class="ic">📈</span>Analyse</button>
      </div>
      <div class="spacer"></div>
      <button id="soundBtn" class="side-btn" title="Ton an/aus">🔊 Ton an</button>
    </nav>

    <div class="content">
      <section id="home"></section>
      <main class="layout">
        <section class="board-area">
          <div class="player-strip" id="stripTop"></div>
          <div class="board-row">
            <div class="evalbar" id="evalbar"><div class="evalfill" id="evalfill"></div><span id="evaltext"></span></div>
            <div class="board-wrap" id="board"></div>
          </div>
          <div class="player-strip" id="stripBottom"></div>
        </section>

        <aside class="panel">
          <div id="panel-play" class="tabpanel"></div>
          <div id="panel-puzzle" class="tabpanel hidden"></div>
          <div id="panel-analysis" class="tabpanel hidden"></div>
        </aside>
      </main>
    </div>
  </div>

  <div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>

  <script src="engine.js"></script>
  <script src="puzzles.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>
