<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Schach-Trainer</title>
  <meta name="theme-color" content="#160f11">
  <meta name="description" content="Schach lernen offline: Bots, Rätsel und Partieanalyse">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Schach">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="icons.css">
</head>
<body>
  <div class="app">
    <nav class="sidebar">
      <div class="brand"><span class="logo"><i class="ic i-chess-knight"></i></span><div>Schach-Trainer<small>OFFLINE · KOSTENLOS</small></div></div>
      <div class="tabs">
        <button data-tab="home"><i class="ic i-house"></i><span class="lf">Übersicht</span><span class="ls">Start</span></button>
        <button data-tab="learn"><i class="ic i-graduation-cap"></i><span>Lernen</span></button>
        <button data-tab="openings"><i class="ic i-book-open"></i><span class="lf">Eröffnungen</span><span class="ls">Eröffn.</span></button>
        <button data-tab="play"><i class="ic i-swords"></i><span>Spielen</span></button>
        <button data-tab="puzzle"><i class="ic i-puzzle"></i><span>Rätsel</span></button>
        <button data-tab="analysis"><i class="ic i-chart-line"></i><span>Analyse</span></button>
      </div>
      <div class="spacer"></div>
      <button id="piecesBtn" class="side-btn" title="Figuren ändern"><i class="ic i-palette"></i> Figuren</button>
      <button id="soundBtn" class="side-btn" title="Ton an/aus"></button>
    </nav>

    <div class="content">
      <header class="mtop">
        <div class="mtop-title" id="mtopTitle"></div>
        <button class="mtop-btn" id="mPieces" title="Figuren ändern"><i class="ic i-palette"></i></button>
        <button class="mtop-btn" id="mSound" title="Ton an/aus"></button>
      </header>
      <section id="home"></section>
      <section id="learn"></section>
      <section id="openings"></section>
      <main class="layout">
        <section class="board-area">
          <div class="lesson-top" id="lessonTop"></div>
          <div class="player-strip" id="stripTop"></div>
          <div class="board-row">
            <div class="evalbar" id="evalbar"><div class="evalfill" id="evalfill"></div><span id="evaltext"></span></div>
            <div class="board-wrap" id="board"></div>
          </div>
          <div class="player-strip" id="stripBottom"></div>
          <div class="board-nav hidden" id="boardNav"></div>
          <div class="lesson-bar" id="lessonBar"></div>
        </section>

        <aside class="panel">
          <div id="panel-play" class="tabpanel"></div>
          <div id="panel-puzzle" class="tabpanel hidden"></div>
          <div id="panel-analysis" class="tabpanel hidden"></div>
          <div id="panel-openings" class="tabpanel hidden"></div>
          <div id="panel-free" class="tabpanel hidden"></div>
          <div id="panel-editor" class="tabpanel hidden"></div>
        </aside>
      </main>
    </div>
  </div>

  <div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>

  <script src="engine.js"></script>
  <script src="puzzles.js"></script>
  <script src="lessons.js"></script>
  <script src="openings.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>
